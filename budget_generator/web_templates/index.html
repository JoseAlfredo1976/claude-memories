<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de Presupuestos – Grupo Europa</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root { --blue:#4F84B5; --blue-dark:#3a6a96; --blue-light:#e8f0f8; }
  body { background:#f0f4f8; font-family:'Segoe UI',Calibri,sans-serif; margin:0; }

  .app-header {
    background:linear-gradient(135deg,var(--blue-dark),var(--blue));
    color:white; padding:16px 0; box-shadow:0 2px 8px rgba(0,0,0,.2); position:sticky; top:0; z-index:100;
  }
  .app-header h1 { font-size:1.3rem; font-weight:700; margin:0; }
  .app-header p  { margin:2px 0 0; opacity:.85; font-size:.82rem; }

  /* Progress */
  .progress-wrap { height:4px; background:#cdd8e8; }
  .progress-fill { height:100%; background:var(--blue); transition:width .5s ease; }

  /* Chat layout */
  .chat-wrap { max-width:700px; margin:0 auto; padding:24px 16px 120px; }

  /* Bot message */
  .msg-bot { display:flex; align-items:flex-start; gap:10px; margin-bottom:16px; }
  .msg-bot .av {
    width:34px; height:34px; background:var(--blue); color:white;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:.75rem; font-weight:800; flex-shrink:0; margin-top:2px;
  }
  .msg-bot .bub {
    background:white; border-radius:2px 14px 14px 14px;
    padding:12px 16px; box-shadow:0 1px 4px rgba(0,0,0,.08);
    max-width:90%; font-size:.92rem; line-height:1.5;
  }

  /* User response */
  .msg-user { display:flex; justify-content:flex-end; margin-bottom:14px; }
  .msg-user .bub {
    background:var(--blue); color:white; border-radius:14px 2px 14px 14px;
    padding:10px 14px; max-width:75%; font-size:.88rem;
  }

  /* Input panel */
  .input-panel {
    background:white; border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.09);
    padding:20px; margin-left:44px; margin-bottom:16px;
  }

  /* Type cards */
  .type-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; }
  .type-card {
    border:2px solid #cdd8e8; border-radius:10px; padding:10px 6px;
    cursor:pointer; text-align:center; background:white; transition:all .2s;
    user-select:none;
  }
  .type-card:hover { border-color:var(--blue); box-shadow:0 3px 10px rgba(79,132,181,.2); transform:translateY(-2px); }
  .type-card.selected { border-color:var(--blue); background:var(--blue-light); }
  .type-card .tc-icon { font-size:1.6rem; }
  .type-card .tc-name { font-size:.7rem; font-weight:700; color:var(--blue-dark); line-height:1.2; margin-top:4px; }

  /* Form controls */
  .form-label { font-size:.82rem; font-weight:600; color:#555; margin-bottom:3px; }
  .form-control, .form-select { border-radius:8px; border-color:#cdd8e8; font-size:.88rem; }
  .form-control:focus, .form-select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(79,132,181,.15); }

  /* Continue button */
  .btn-next {
    background:var(--blue); color:white; border:none;
    border-radius:24px; padding:9px 24px; font-weight:600; font-size:.9rem;
    transition:all .2s;
  }
  .btn-next:hover { background:var(--blue-dark); color:white; transform:translateX(3px); }

  /* Generate */
  .btn-gen {
    width:100%; padding:14px; font-size:1.05rem; font-weight:700;
    background:linear-gradient(135deg,var(--blue),var(--blue-dark));
    color:white; border:none; border-radius:12px;
    box-shadow:0 4px 14px rgba(79,132,181,.4); transition:all .2s;
  }
  .btn-gen:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(79,132,181,.5); }

  /* Partidas */
  .tbl-part { font-size:.83rem; }
  .tbl-part thead th { background:var(--blue); color:white; border:none; padding:7px 6px; white-space:nowrap; }
  .tbl-part td { padding:5px 5px; vertical-align:middle; }
  .tbl-part .total-cell { font-weight:700; color:var(--blue-dark); }

  /* Service lines */
  .tbl-svc thead th { background:var(--blue); color:white; border:none; padding:7px 10px; font-size:.85rem; }
  .tbl-svc td { padding:6px 8px; vertical-align:middle; font-size:.87rem; }

  /* Totals */
  .total-row { background:var(--blue-light); border:1px solid #cdd8e8; border-radius:8px; padding:9px 14px; }
  .total-val { font-size:1.05rem; font-weight:800; color:var(--blue-dark); }

  /* Overlay */
  #overlay { display:none; position:fixed; inset:0; background:rgba(10,20,45,.65); z-index:9999; flex-direction:column; align-items:center; justify-content:center; color:white; }
  #overlay.show { display:flex; }
  #overlay .spinner-border { width:3rem; height:3rem; border-width:.3rem; }

  /* Fade in */
  @keyframes fi { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  .fi { animation:fi .3s ease forwards; }

  /* badge */
  .tbadge { font-size:.7rem; background:#28a745; color:white; border-radius:4px; padding:1px 5px; margin-left:4px; display:none; }

  /* Warning */
  .warn-box { background:#fff3cd; border:1px solid #ffc107; border-radius:8px; padding:10px 14px; font-size:.85rem; }
</style>
</head>
<body>

<div class="app-header">
  <div class="container">
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-file-earmark-text-fill" style="font-size:1.8rem"></i>
      <div>
        <h1>Generador de Presupuestos – Grupo Europa</h1>
        <p>Acometidas Europa S.L. &nbsp;·&nbsp; 91 386 21 12</p>
      </div>
    </div>
  </div>
</div>
<div class="progress-wrap"><div class="progress-fill" id="prog" style="width:8%"></div></div>

<div id="overlay">
  <div class="spinner-border text-light"></div>
  <p class="mt-3 fs-5">Generando documentos…</p>
</div>

<!-- Hidden form submitted at the end -->
<form id="ff" action="/generar" method="POST" style="display:none"></form>

<div class="chat-wrap">

  {% if missing_templates %}
  <div class="warn-box mb-3">
    <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
    Faltan plantillas — ejecuta: <code>python download_templates.py</code>
  </div>
  {% endif %}

  <div id="chat"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ─── State ───────────────────────────────────────────────────────────────────
const fd = {};           // collected form data
let tipo = '';           // selected tipo_modelo
const rc = {};           // row counters per prefix

// ─── Type catalogue ───────────────────────────────────────────────────────────
const TIPOS = [
  { id:'obra_1',         icon:'🏗️',  name:'Obra\n1 Opción',     cat:'obra' },
  { id:'obra_2',         icon:'🔀',  name:'Obra\n2 Opciones',   cat:'obra' },
  { id:'desatasco',      icon:'🚛',  name:'Desatasco',          cat:'svc'  },
  { id:'cctv_bajante',   icon:'📷',  name:'CCTV\nBajante',      cat:'svc'  },
  { id:'inspeccion_zum', icon:'🔍',  name:'Inspección\nZUM',    cat:'svc'  },
  { id:'limpieza_aerea', icon:'💨',  name:'Limpieza\nAérea',    cat:'svc'  },
  { id:'fresador',       icon:'⚙️',  name:'Fresador',           cat:'svc'  },
  { id:'robot_limpieza', icon:'🤖',  name:'Robot\nLimpieza',    cat:'svc'  },
  { id:'fuga_agua',      icon:'💧',  name:'Fuga\nAgua',         cat:'svc'  },
  { id:'vaciado_fosa',   icon:'🪣',  name:'Vaciado\nFosa',      cat:'svc'  },
];
const TLABELS = {};
TIPOS.forEach(t => TLABELS[t.id] = t.icon + ' ' + t.name.replace('\n',' '));

const SVC_ROWS = {
  desatasco:      [['CAMION','Camión cuba alta presión'],['CAMION_DESP','Desplazamiento camión'],['TAPA','Tapón de registro'],['INODORO','Desmontaje de inodoro'],['CATA','Cata en mocheta']],
  cctv_bajante:   [['CCTV','Inspección CCTV bajante'],['CCTV_DESP','Desplazamiento CCTV'],['TAPA','Tapón de registro'],['INODORO','Desmontaje de inodoro'],['CATA','Cata en mocheta']],
  inspeccion_zum: [['CCTV','Inspección CCTV / ZUM'],['CCTV_DESP','Desplazamiento CCTV']],
  limpieza_aerea: [['CAMION','Camión alta presión'],['CAMION_DESP','Desplazamiento camión'],['OCUPACION','Ocupación vía pública'],['MEDIOS','Medios auxiliares'],['TAPA','Tapón de registro']],
  fresador:       [['FRESADOR','Robot fresador'],['FRESADOR_DESP','Desplazamiento fresador'],['CAMION','Camión alta presión'],['CAMION_DESP','Desplazamiento camión'],['MEDIOS','Medios auxiliares']],
  robot_limpieza: [['CCTV','Robot CCTV'],['CCTV_DESP','Desplazamiento CCTV'],['CAMION','Camión alta presión'],['CAMION_DESP','Desplazamiento camión'],['OCUPACION','Ocupación vía pública'],['MEDIOS','Medios auxiliares'],['LOCALIZACION','Localización / Robot']],
};

// ─── Chat DOM helpers ─────────────────────────────────────────────────────────
function botMsg(html) {
  const d = document.createElement('div');
  d.className = 'msg-bot fi';
  d.innerHTML = `<div class="av">GE</div><div class="bub">${html}</div>`;
  chat().appendChild(d);
  scrollBot();
}
function userMsg(txt) {
  const d = document.createElement('div');
  d.className = 'msg-user fi';
  d.innerHTML = `<div class="bub">${esc(txt)}</div>`;
  chat().appendChild(d);
  scrollBot();
}
function panel(html) {
  rmPanel();
  const d = document.createElement('div');
  d.className = 'input-panel fi';
  d.id = 'panel';
  d.innerHTML = html;
  chat().appendChild(d);
  setTimeout(() => d.scrollIntoView({behavior:'smooth',block:'nearest'}), 80);
}
function rmPanel() { const el = document.getElementById('panel'); if (el) el.remove(); }
function chat() { return document.getElementById('chat'); }
function scrollBot() { setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),100); }
function prog(pct) { document.getElementById('prog').style.width = pct + '%'; }

// ─── STEP 1 — Tipo ────────────────────────────────────────────────────────────
function step1() {
  prog(8);
  botMsg('¡Hola! Soy el Generador de Presupuestos de <strong>Grupo Europa</strong>.<br>¿Qué tipo de presupuesto necesitas hoy?');
  const obras = TIPOS.filter(t=>t.cat==='obra').map(card).join('');
  const svcs  = TIPOS.filter(t=>t.cat==='svc').map(card).join('');
  panel(`
    <div class="text-muted small fw-bold mb-2">PRESUPUESTOS DE OBRA</div>
    <div class="type-grid mb-3">${obras}</div>
    <div class="text-muted small fw-bold mb-2">DESATASCOS Y SERVICIOS</div>
    <div class="type-grid mb-3">${svcs}</div>
    <div class="text-end">
      <button class="btn btn-next" onclick="ok1()">Continuar <i class="bi bi-arrow-right ms-1"></i></button>
    </div>`);
}

function card(t) {
  const lines = t.name.split('\n');
  return `<div class="type-card" onclick="selTipo('${t.id}',this)">
    <div class="tc-icon">${t.icon}</div>
    <div class="tc-name">${lines.join('<br>')}</div>
  </div>`;
}
function selTipo(t,el) {
  document.querySelectorAll('.type-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  tipo = t;
}
function ok1() {
  if (!tipo) { alert('Elige el tipo de presupuesto.'); return; }
  fd.tipo_modelo = tipo;
  rmPanel(); userMsg(TLABELS[tipo]); step2();
}

// ─── STEP 2 — Contrato + obra + fecha ────────────────────────────────────────
function step2() {
  prog(22);
  const isObra = tipo.startsWith('obra');
  botMsg(`Perfecto. Dame el <strong>número de contrato</strong>, la ${isObra ? 'dirección de la obra' : 'dirección del servicio'} y la <strong>fecha</strong>.`);
  panel(`
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Nº de contrato *</label>
        <input id="f_num" type="text" class="form-control" placeholder="Ej: 4680/26">
      </div>
      <div class="col-md-8">
        <label class="form-label">${isObra ? 'Nombre obra / dirección' : 'Dirección del servicio'} *</label>
        <input id="f_obra" type="text" class="form-control" placeholder="Ej: C/ Mayor 10, Madrid">
      </div>
      <div class="col-md-5">
        <label class="form-label">Tipo de servicio</label>
        <input id="f_serv" type="text" class="form-control" placeholder="Ej: Saneamiento y Pocería">
      </div>
      <div class="col-md-3">
        <label class="form-label">Provincia</label>
        <input id="f_prov" type="text" class="form-control" value="Madrid">
      </div>
      <div class="col-md-4">
        <label class="form-label">Fecha</label>
        <input id="f_fecha" type="date" class="form-control" value="{{ today }}">
      </div>
    </div>
    <div class="text-end mt-3">
      <button class="btn btn-next" onclick="ok2()">Continuar <i class="bi bi-arrow-right ms-1"></i></button>
    </div>`);
}
function ok2() {
  const num  = v('f_num');
  const obra = v('f_obra');
  if (!num||!obra) { alert('El nº de contrato y la dirección son obligatorios.'); return; }
  fd.num_contrato = num; fd.obra = obra;
  fd.servicio = v('f_serv'); fd.provincia = v('f_prov')||'Madrid';
  fd.fecha_contrato = v('f_fecha');
  rmPanel(); userMsg(`Contrato ${num} · ${obra}`); step3();
}

// ─── STEP 3 — Cliente ─────────────────────────────────────────────────────────
function step3() {
  prog(38);
  botMsg('¿A nombre de quién va el presupuesto? Dame los datos del <strong>cliente</strong>.');
  const xtra = tipo==='vaciado_fosa' ? `
    <div class="col-md-6"><label class="form-label">Teléfono administrador</label><input id="f_atel" type="text" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Email administrador</label><input id="f_amail" type="email" class="form-control"></div>` : '';
  panel(`
    <div class="row g-3">
      <div class="col-md-8"><label class="form-label">Nombre del cliente / comunidad *</label>
        <input id="f_cnombre" type="text" class="form-control" placeholder="C.P. C/ Mayor 10"></div>
      <div class="col-md-4"><label class="form-label">Teléfono</label>
        <input id="f_ctel" type="text" class="form-control"></div>
      <div class="col-md-8"><label class="form-label">Dirección del cliente</label>
        <input id="f_cdir" type="text" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Email</label>
        <input id="f_cmail" type="email" class="form-control"></div>
      <div class="col-12"><label class="form-label">Administrador / promotor</label>
        <input id="f_admin" type="text" class="form-control" placeholder="Ej: Gesfinc Administración"></div>
      ${xtra}
    </div>
    <div class="text-end mt-3">
      <button class="btn btn-next" onclick="ok3()">Continuar <i class="bi bi-arrow-right ms-1"></i></button>
    </div>`);
}
function ok3() {
  const n = v('f_cnombre');
  if (!n) { alert('El nombre del cliente es obligatorio.'); return; }
  fd.cliente_nombre = n; fd.cliente_tel = v('f_ctel');
  fd.cliente_dir = v('f_cdir'); fd.cliente_email = v('f_cmail');
  fd.administracion = v('f_admin')||'—';
  if (tipo==='vaciado_fosa') {
    fd.admin_tel  = v('f_atel')||'';
    fd.admin_email= v('f_amail')||'';
  }
  rmPanel();
  userMsg(n + (fd.administracion && fd.administracion!=='—' ? ` · ${fd.administracion}` : ''));
  // Route based on type
  if (tipo==='obra_1'||tipo==='obra_2') return stepObraTextos();
  if (tipo==='fuga_agua')    return stepFuga();
  if (tipo==='vaciado_fosa') return stepVaciado();
  return stepSvc();
}

// ─── STEP 4a — Obra: textos técnicos ────────────────────────────────────────
function stepObraTextos() {
  prog(52);
  botMsg('Cuéntame el <strong>problema técnico</strong> y la <strong>solución propuesta</strong>.');
  const extra2 = tipo==='obra_2' ? `
    <div class="col-12"><label class="form-label">Memoria Opción A (Tradicional)</label>
      <textarea id="f_mtrad" class="form-control" rows="2"></textarea></div>
    <div class="col-12"><label class="form-label">Memoria Opción B (Multiliner)</label>
      <textarea id="f_mmulti" class="form-control" rows="2"></textarea></div>
    <div class="col-md-5"><label class="form-label">Tipo de opción</label>
      <input id="f_topcion" type="text" class="form-control" placeholder="Multiliner"></div>` : '';
  panel(`
    <div class="row g-3">
      <div class="col-12"><label class="form-label">Informe técnico <span class="text-muted fw-normal">(descripción del problema)</span></label>
        <textarea id="f_inf" class="form-control" rows="2" placeholder="Se han detectado filtraciones…"></textarea></div>
      <div class="col-12"><label class="form-label">Solución adoptada</label>
        <textarea id="f_sol" class="form-control" rows="2" placeholder="Sustitución de los tramos afectados…"></textarea></div>
      <div class="col-12"><label class="form-label">Memoria técnica</label>
        <textarea id="f_mem" class="form-control" rows="3" placeholder="Los trabajos incluyen…"></textarea></div>
      ${extra2}
    </div>
    <div class="text-end mt-3">
      <button class="btn btn-next" onclick="okObraTextos()">Continuar <i class="bi bi-arrow-right ms-1"></i></button>
    </div>`);
}
function okObraTextos() {
  fd.informe=v('f_inf'); fd.solucion=v('f_sol'); fd.memoria=v('f_mem');
  if (tipo==='obra_2') {
    fd.memoria_tradicional=v('f_mtrad'); fd.memoria_multiliner=v('f_mmulti');
    fd.tipo_opcion=v('f_topcion');
  }
  rmPanel(); userMsg('Textos técnicos ✓');
  if (tipo==='obra_2') stepPartidas('a');
  else stepPartidas('1');
}

// ─── STEP 5 — Partidas ───────────────────────────────────────────────────────
function stepPartidas(which) {
  prog(which==='b' ? 78 : 65);
  const label = which==='b' ? 'las partidas de la <strong>Opción B</strong>' :
                which==='a' ? 'las partidas de la <strong>Opción A</strong>' :
                'las <strong>partidas de obra</strong>';
  botMsg(`Añade ${label}. Escribe un código de tarifa para autocompletar, o rellena manualmente.`);
  const prefix = which==='1'?'item':which==='a'?'item_a':'item_b';
  const bid    = 'bar'+which;
  const blabel = which==='b'?'TOTAL B':which==='a'?'TOTAL A':'TOTAL';
  rc[prefix] = 0;
  panel(`
    <div class="table-responsive">
      <table class="table table-bordered tbl-part" id="tbl${which}">
        <thead><tr>
          <th style="width:115px">Código</th><th>Descripción *</th>
          <th style="width:68px">Ud</th><th style="width:72px">Cant.</th>
          <th style="width:95px">Precio €</th><th style="width:95px">Total</th>
          <th style="width:34px"></th>
        </tr></thead>
        <tbody id="tb${which}"></tbody>
      </table>
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary mb-3"
            onclick="addRow('${prefix}','tb${which}','${bid}')">
      <i class="bi bi-plus-circle"></i> Añadir partida
    </button>
    <div class="total-row d-flex justify-content-between align-items-center mb-3" id="${bid}">
      <span class="text-muted small"><span class="nr">0</span> partida(s)</span>
      <span class="total-val">${blabel}: <span class="tv">0,00 €</span></span>
    </div>
    <div class="text-end">
      <button class="btn btn-next" onclick="okPartidas('${which}','${prefix}')">
        Continuar <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </div>`);
  // Start with 2 empty rows
  addRow(prefix,'tb'+which,bid);
  addRow(prefix,'tb'+which,bid);
}
function okPartidas(which, prefix) {
  const n = document.querySelectorAll(`#tb${which} tr`).length;
  if (!n) { alert('Añade al menos una partida.'); return; }
  // collect rows into fd
  document.querySelectorAll(`#tb${which} tr`).forEach(tr => {
    const i = tr.id.replace(prefix+'-row-','');
    ['desc','unit','qty','price'].forEach(f => {
      const el = tr.querySelector(`[name="${prefix}_${f}_${i}"]`);
      if (el) fd[`${prefix}_${f}_${i}`] = el.value;
    });
  });
  rmPanel(); userMsg(`${n} partida(s) ✓`);
  if (which==='a') stepPartidas('b');
  else stepCondiciones();
}

// ─── STEP 6 — Condiciones ────────────────────────────────────────────────────
function stepCondiciones() {
  prog(88);
  botMsg('Casi listo. Dame las <strong>condiciones económicas</strong>.');
  const firm = tipo==='obra_2' ? `
    <div class="col-md-5"><label class="form-label">Nombre del firmante</label><input id="f_fnombre" type="text" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Cargo</label><input id="f_fcargo" type="text" class="form-control" placeholder="Director Técnico"></div>
    <div class="col-md-3"><label class="form-label">DNI</label><input id="f_fdni" type="text" class="form-control"></div>` : '';
  panel(`
    <div class="row g-3">
      <div class="col-md-3"><label class="form-label">Plazo (días)</label>
        <input id="f_plazo" type="number" class="form-control" value="30" min="1"></div>
      <div class="col-md-9"><label class="form-label">Forma de pago</label>
        <input id="f_pago" type="text" class="form-control" value="50% al inicio de los trabajos, 50% a la finalización"></div>
      ${firm}
    </div>
    <div class="text-end mt-3">
      <button class="btn btn-next" onclick="okCondiciones()">Continuar <i class="bi bi-arrow-right ms-1"></i></button>
    </div>`);
}
function okCondiciones() {
  fd.plazo=v('f_plazo')||'30'; fd.forma_pago=v('f_pago');
  if (tipo==='obra_2') {
    fd.firmante_nombre=v('f_fnombre')||''; fd.firmante_cargo=v('f_fcargo')||''; fd.firmante_dni=v('f_fdni')||'';
  }
  rmPanel(); userMsg(`Plazo: ${fd.plazo} días`); stepGenerar();
}

// ─── STEP 4b — Servicios (tarifas) ───────────────────────────────────────────
function stepSvc() {
  prog(62);
  botMsg('Introduce las <strong>unidades y precios</strong> del servicio. El importe se calcula automáticamente.');
  const rows = (SVC_ROWS[tipo]||[]).map(([key,label]) => `
    <tr>
      <td class="fw-semibold" style="font-size:.87rem">${label}</td>
      <td><input type="number" id="s_${key.toLowerCase()}_u" class="form-control form-control-sm svc-u" value="1" min="0" step="any" oninput="cSvc()"></td>
      <td><input type="number" id="s_${key.toLowerCase()}_p" class="form-control form-control-sm svc-p" value="0" min="0" step="any" oninput="cSvc()"></td>
      <td class="fw-bold svc-i" id="s_${key.toLowerCase()}_i">0,00 €</td>
    </tr>`).join('');
  const hasHoras  = ['limpieza_aerea','fresador','robot_limpieza'].includes(tipo);
  const hasTiempo = ['limpieza_aerea','robot_limpieza'].includes(tipo);
  panel(`
    <table class="table table-bordered tbl-svc mb-3">
      <thead><tr>
        <th style="min-width:170px">Servicio</th>
        <th style="width:95px">Uds.</th>
        <th style="width:110px">Precio/ud €</th>
        <th style="width:100px">Importe €</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${hasHoras?`<div class="row g-2 mb-3">
      <div class="col-4"><label class="form-label">Horas estimadas</label><input id="f_horas" type="text" class="form-control" placeholder="4"></div>
      ${hasTiempo?`<div class="col-5"><label class="form-label">Tiempo estimado</label><input id="f_tiempo" type="text" class="form-control" placeholder="Medio día"></div>`:''}
    </div>`:''}
    <div class="total-row d-flex justify-content-end mb-3">
      <span class="total-val">TOTAL ESTIMADO: <span id="tsvc">0,00 €</span></span>
    </div>
    <div class="text-end">
      <button class="btn btn-next" onclick="okSvc()">Continuar <i class="bi bi-arrow-right ms-1"></i></button>
    </div>`);
}
function cSvc() {
  // update per-row importe
  (SVC_ROWS[tipo]||[]).forEach(([key]) => {
    const k=key.toLowerCase();
    const u=parseFloat(document.getElementById(`s_${k}_u`)?.value)||0;
    const p=parseFloat(document.getElementById(`s_${k}_p`)?.value)||0;
    const iEl=document.getElementById(`s_${k}_i`);
    if(iEl) iEl.textContent=fmtE(u*p);
  });
  let tot=0;
  document.querySelectorAll('.svc-u').forEach(u=>{
    const p=u.closest('tr').querySelector('.svc-p');
    tot+=(parseFloat(u.value)||0)*(parseFloat(p?.value)||0);
  });
  const el=document.getElementById('tsvc'); if(el) el.textContent=fmtE(tot);
}
function okSvc() {
  (SVC_ROWS[tipo]||[]).forEach(([key]) => {
    const k=key.toLowerCase();
    fd[k+'_uds']   = document.getElementById(`s_${k}_u`)?.value||'0';
    fd[k+'_precio'] = document.getElementById(`s_${k}_p`)?.value||'0';
  });
  if (document.getElementById('f_horas'))  fd.horas_estimadas  = v('f_horas');
  if (document.getElementById('f_tiempo')) fd.tiempo_estimado  = v('f_tiempo');
  rmPanel(); userMsg('Tarifas del servicio ✓'); stepGenerar();
}

// ─── STEP 4c — Fuga agua ─────────────────────────────────────────────────────
function stepFuga() {
  prog(62);
  botMsg('Datos del servicio de <strong>localización de fuga de agua</strong>.');
  panel(`
    <div class="row g-3">
      <div class="col-12"><label class="form-label">Localización del servicio</label>
        <input id="f_loc" type="text" class="form-control" placeholder="Red horizontal bajo solera planta baja"></div>
      <div class="col-md-4"><label class="form-label">Precio localización fuga (€)</label>
        <input id="f_ploc" type="number" class="form-control" value="950" step="any"></div>
      <div class="col-md-4"><label class="form-label">Precio hora adicional (€)</label>
        <input id="f_phora" type="number" class="form-control" value="110" step="any"></div>
      <div class="col-md-4"><label class="form-label">Precio bombona gas (€)</label>
        <input id="f_pbomb" type="number" class="form-control" value="160" step="any"></div>
    </div>
    <div class="text-end mt-3">
      <button class="btn btn-next" onclick="okFuga()">Continuar <i class="bi bi-arrow-right ms-1"></i></button>
    </div>`);
}
function okFuga() {
  fd.localizacion_servicio=v('f_loc'); fd.precio_localizacion=v('f_ploc');
  fd.precio_hora_adicional=v('f_phora'); fd.precio_bombona=v('f_pbomb');
  rmPanel(); userMsg('Datos de fuga ✓'); stepGenerar();
}

// ─── STEP 4d — Vaciado fosa ──────────────────────────────────────────────────
function stepVaciado() {
  prog(62);
  botMsg('Datos del servicio de <strong>vaciado de fosa</strong>.');
  panel(`
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label">Validez de la oferta</label>
        <input id="f_val" type="text" class="form-control" value="30 días"></div>
      <div class="col-12"><div class="small fw-bold text-muted">Unidades de cada operación:</div></div>
      <div class="col-md-4"><label class="form-label">Ud. desplazamiento</label><input id="f_udesp" type="text" class="form-control" placeholder="1"></div>
      <div class="col-md-4"><label class="form-label">Ud. succión</label><input id="f_usuc" type="text" class="form-control" placeholder="1"></div>
      <div class="col-md-4"><label class="form-label">Ud. limpieza</label><input id="f_ulimp" type="text" class="form-control" placeholder="1"></div>
      <div class="col-md-4"><label class="form-label">Ud. descarga</label><input id="f_udesc" type="text" class="form-control" placeholder="1"></div>
      <div class="col-md-4"><label class="form-label">Ud. residuo</label><input id="f_ures" type="text" class="form-control" placeholder="1"></div>
    </div>
    <div class="text-end mt-3">
      <button class="btn btn-next" onclick="okVaciado()">Continuar <i class="bi bi-arrow-right ms-1"></i></button>
    </div>`);
}
function okVaciado() {
  fd.validez_oferta=v('f_val'); fd.ud_desplazamiento=v('f_udesp');
  fd.ud_succion=v('f_usuc'); fd.ud_limpieza=v('f_ulimp');
  fd.ud_descarga=v('f_udesc'); fd.ud_residuo=v('f_ures');
  rmPanel(); userMsg('Datos vaciado ✓'); stepGenerar();
}

// ─── FINAL STEP — Generar ────────────────────────────────────────────────────
function stepGenerar() {
  prog(100);
  botMsg('¡Todo listo! Pulsa <strong>Generar presupuesto</strong> para crear los documentos.');
  panel(`
    <button class="btn btn-gen" onclick="submit()">
      <i class="bi bi-file-earmark-arrow-down me-2"></i>Generar presupuesto
    </button>
    <p class="text-muted small text-center mt-2">Se generarán Word y PDF automáticamente</p>`);
}
function submit() {
  const form = document.getElementById('ff');
  form.innerHTML = '';
  Object.entries(fd).forEach(([k,val]) => {
    const inp = document.createElement('input');
    inp.type='hidden'; inp.name=k; inp.value=val||'';
    form.appendChild(inp);
  });
  document.getElementById('overlay').classList.add('show');
  form.submit();
}

// ─── Partidas rows ────────────────────────────────────────────────────────────
function addRow(prefix, tbId, barId, desc='', unit='PA', qty=1, price=0) {
  if (!rc[prefix]) rc[prefix]=0;
  const i = rc[prefix]++;
  const tr = document.createElement('tr');
  tr.id = `${prefix}-row-${i}`;
  const tot = qty*price;
  tr.innerHTML = `
    <td><input type="text" class="form-control form-control-sm tc" placeholder="ARQ-…"
               onblur="ltarifa(this,'${prefix}',${i},'${barId}')"></td>
    <td>
      <input type="text" name="${prefix}_desc_${i}" class="form-control form-control-sm" placeholder="Descripción" value="${esc(desc)}">
      <span class="tbadge" id="${prefix}bg${i}">✓ Tarifa</span>
    </td>
    <td><select name="${prefix}_unit_${i}" class="form-select form-select-sm">
      ${['PA','ud','ml','m²','m³','kg','h'].map(u=>`<option${u===unit?' selected':''}>${u}</option>`).join('')}
    </select></td>
    <td><input type="number" name="${prefix}_qty_${i}" class="form-control form-control-sm" value="${qty}" min="0" step="any" oninput="calcR('${prefix}',${i},'${barId}')"></td>
    <td><input type="number" name="${prefix}_price_${i}" class="form-control form-control-sm" value="${price}" min="0" step="any" oninput="calcR('${prefix}',${i},'${barId}')"></td>
    <td class="total-cell text-end" id="${prefix}t${i}">${fmtE(tot)}</td>
    <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="delRow('${prefix}',${i},'${barId}')"><i class="bi bi-trash3"></i></button></td>`;
  document.getElementById(tbId).appendChild(tr);
  updBar(barId,prefix,tbId);
}
function delRow(prefix,i,barId) {
  const which = barId.replace('bar','');
  const tbId = 'tb'+which;
  const r=document.getElementById(`${prefix}-row-${i}`); if(r) r.remove();
  updBar(barId,prefix,tbId);
}
function calcR(prefix,i,barId) {
  const q=parseFloat(document.querySelector(`[name="${prefix}_qty_${i}"]`).value)||0;
  const p=parseFloat(document.querySelector(`[name="${prefix}_price_${i}"]`).value)||0;
  document.getElementById(`${prefix}t${i}`).textContent=fmtE(q*p);
  const which=barId.replace('bar','');
  updBar(barId,prefix,'tb'+which);
}
function updBar(barId,prefix,tbId) {
  const bar=document.getElementById(barId); if(!bar) return;
  const tbody=document.getElementById(tbId); if(!tbody) return;
  let sub=0,n=0;
  tbody.querySelectorAll('tr').forEach(tr=>{
    const i=tr.id.replace(prefix+'-row-','');
    const q=parseFloat(tr.querySelector(`[name="${prefix}_qty_${i}"]`)?.value)||0;
    const p=parseFloat(tr.querySelector(`[name="${prefix}_price_${i}"]`)?.value)||0;
    sub+=q*p; n++;
  });
  const nr=bar.querySelector('.nr'); if(nr) nr.textContent=n;
  const tv=bar.querySelector('.tv'); if(tv) tv.textContent=fmtE(sub*1.21);
}
async function ltarifa(inp,prefix,i,barId) {
  const code=inp.value.trim().toUpperCase(); if(!code) return;
  try {
    const r=await fetch(`/api/tarifa/${encodeURIComponent(code)}`);
    if(!r.ok) return;
    const d=await r.json();
    if(d.descripcion){
      document.querySelector(`[name="${prefix}_desc_${i}"]`).value=d.descripcion;
      document.querySelector(`[name="${prefix}_price_${i}"]`).value=d.precio||0;
      const uS=document.querySelector(`[name="${prefix}_unit_${i}"]`);
      if(d.unidad)[...uS.options].forEach(o=>o.selected=(o.value===d.unidad));
      const bg=document.getElementById(`${prefix}bg${i}`); if(bg) bg.style.display='inline';
      const which=barId.replace('bar','');
      calcR(prefix,i,barId);
    }
  } catch(e){}
}

// ─── Tiny helpers ─────────────────────────────────────────────────────────────
function v(id) { return (document.getElementById(id)?.value||'').trim(); }
function fmtE(n) { return parseFloat(n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── Boot ─────────────────────────────────────────────────────────────────────
step1();
</script>
